name: ci-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and redeploy even if this upstream commit is already built
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One deploy at a time; a running deploy is never cancelled, and only the newest queued run survives.
  group: ci-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  UPSTREAM: bertha-hallo/PeerMeet
  UPSTREAM_BRANCH: main
  IMAGE: ghcr.io/rigelis-inc/peermeet

jobs:
  # Pins the upstream commit for this run and decides whether it still needs building.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      tag: ${{ steps.pin.outputs.tag }}
      skip: ${{ steps.pin.outputs.skip }}
    steps:
      - name: Pin upstream commit
        id: pin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git ls-remote "https://github.com/${UPSTREAM}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve upstream HEAD: '$sha'"; exit 1; }
          # Tag carries both the upstream commit and the tooling commit, so either change produces a new image.
          tag="build-${sha::12}-${GITHUB_SHA::12}"
          skip=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$FORCE" != true ]; then
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
            if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then skip=true; fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "upstream=$sha tag=$tag skip=$skip"

  # Pull requests: build the current upstream with the proposed tooling. No registry write, no secrets.
  test:
    needs: resolve
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: app
          persist-credentials: false
      - name: Build
        run: docker build -f Dockerfile -t peermeet:ci app
      - name: Smoke test
        run: bash .github/scripts/smoke.sh peermeet:ci

  # Dispatches (from the poller or by hand) and tooling pushes on main: build the pinned upstream commit and publish it.
  publish:
    needs: resolve
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: app
          fetch-depth: 20
          persist-credentials: false
      - name: Show what is being shipped
        run: |
          {
            echo "### Upstream commit being deployed"
            echo "[\`${UPSTREAM}@${SHA::12}\`](https://github.com/${UPSTREAM}/commit/${SHA})"
            echo
            echo "Recent upstream commits:"
            echo '```'
            git -C app log -n 10 --format='%h %an  %s'
            echo '```'
            echo "Files changed in the latest upstream commit:"
            echo '```'
            git -C app show --stat --format= "$SHA" | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
      - name: Build
        run: docker build -f Dockerfile -t peermeet:ci app
      - name: Smoke test
        run: bash .github/scripts/smoke.sh peermeet:ci
      - name: Push to GHCR
        id: push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag peermeet:ci "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
          echo "Published $ref"

  # Deploys automatically once the smoke test has passed. The `production` environment only holds the
  # SSH secret and limits it to `main`. The server pulls the image by digest, so a tag can't be swapped
  # underneath it, and rolls back if the new container doesn't become healthy.
  deploy:
    needs: publish
    # Off until the server side is set up; flip with: gh variable set PEERMEET_ENABLED --body true
    if: vars.PEERMEET_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy over restricted SSH
        env:
          SSH_KEY: ${{ secrets.PEERMEET_SSH_KEY }}
          SSH_HOST: ${{ vars.PEERMEET_HOST }}
          KNOWN_HOSTS: ${{ vars.PEERMEET_KNOWN_HOSTS }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server-side key is locked to one forced command; the argument is the image digest.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "peermeet@${SSH_HOST}" "$DIGEST"
