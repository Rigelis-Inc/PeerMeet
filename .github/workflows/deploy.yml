name: ci-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Build and deploy even if this upstream commit was already attempted
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One deploy at a time; a running deploy is never cancelled, and only the newest queued run survives.
  group: ci-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  UPSTREAM: bertha-hallo/PeerMeet
  UPSTREAM_BRANCH: main

jobs:
  # Pins the upstream commit for this run and records that it was attempted, so a commit that
  # fails to build or deploy is not retried every poll. Use `force` to retry it.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      skip: ${{ steps.pin.outputs.skip }}
    steps:
      - name: Pin upstream commit
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git ls-remote "https://github.com/${UPSTREAM}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve upstream HEAD: '$sha'"; exit 1; }
          mark="seen-${sha::12}-${GITHUB_SHA::12}"
          skip=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            seen=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${mark}" | wc -l)
            if [ "$seen" -gt 0 ] && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$FORCE" != true ]; then
              skip=true
            elif [ "$seen" -eq 0 ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${mark}" -f sha="$GITHUB_SHA" >/dev/null
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "upstream=$sha mark=$mark skip=$skip"

  # Builds the pinned upstream commit with this repo's Dockerfile and smoke-tests it.
  # Pull requests stop here; on main the server then builds the same commits itself.
  test:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: app
          fetch-depth: 20
          persist-credentials: false
      - name: Show what is being shipped
        if: github.event_name != 'pull_request'
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          {
            echo "### Upstream commit being deployed"
            echo "[\`${UPSTREAM}@${SHA::12}\`](https://github.com/${UPSTREAM}/commit/${SHA})"
            echo
            echo "Recent upstream commits:"
            echo '```'
            git -C app log -n 10 --format='%h %an  %s'
            echo '```'
            echo "Files changed in the latest upstream commit:"
            echo '```'
            git -C app show --stat --format= "$SHA" | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: docker build -f Dockerfile -t peermeet:ci app
      - name: Smoke test
        run: bash .github/scripts/smoke.sh peermeet:ci

  # Deploys automatically once the smoke test has passed. The restricted SSH key can only run the
  # server's deploy script, which takes these two commit SHAs, builds them on the server, and rolls
  # back if the new container does not become healthy.
  deploy:
    needs: [resolve, test]
    # Off until the server side is set up; flip with: gh variable set PEERMEET_ENABLED --body true
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.resolve.outputs.skip != 'true' && vars.PEERMEET_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy over restricted SSH
        env:
          SSH_KEY: ${{ secrets.PEERMEET_SSH_KEY }}
          SSH_HOST: ${{ vars.PEERMEET_HOST }}
          KNOWN_HOSTS: ${{ vars.PEERMEET_KNOWN_HOSTS }}
          UPSTREAM_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server-side key is locked to one forced command; the argument is "<app sha> <tooling sha>".
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "peermeet@${SSH_HOST}" "${UPSTREAM_SHA} ${GITHUB_SHA}"
