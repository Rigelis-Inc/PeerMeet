name: poll-upstream

# Watches bertha-hallo/PeerMeet and starts ci-deploy when its main has a commit that was not attempted yet.
# Kept separate from ci-deploy so idle polls never queue behind (or replace) a real build.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  UPSTREAM: bertha-hallo/PeerMeet
  UPSTREAM_BRANCH: main

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch a build if upstream has something new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git ls-remote "https://github.com/${UPSTREAM}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve upstream HEAD: '$sha'"; exit 1; }
          # Must match the marker ci-deploy records: upstream commit + this tooling commit.
          mark="seen-${sha::12}-${GITHUB_SHA::12}"
          seen=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${mark}" | wc -l)
          if [ "$seen" -gt 0 ]; then
            echo "up to date: $mark"
          else
            echo "new upstream commit ${sha::12}; starting ci-deploy"
            gh workflow run ci-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
